{% extends "base.html" %}
{# Wrap whatever the child puts in {% block content %} — including allauth's
   own pages — in the auth card, so every entrance page gets the gutter. #}
{% block content_wrapper %}
<section>
  <div class="auth-wrap">
    <div class="auth-card">
      {{ block.super }}
    </div>
  </div>
</section>
{% endblock %}
