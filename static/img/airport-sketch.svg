<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 600 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sketch of a busy airport with travelers, luggage and aircraft">
  <defs>
    <clipPath id="panel"><rect x="2" y="2" width="596" height="476" rx="18"/></clipPath>
  </defs>

  <!-- Panel -->
  <rect x="2" y="2" width="596" height="476" rx="18" fill="#faf9f5" stroke="#e3ded2" stroke-width="2"/>

  <g clip-path="url(#panel)" fill="none" stroke="#1f1d1b" stroke-width="2.4"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- Sky wash -->
    <rect x="2" y="2" width="596" height="300" fill="#f3efe6" stroke="none"/>

    <!-- Sun -->
    <circle cx="512" cy="74" r="26" fill="#f6e4db" stroke="#cc785c" stroke-width="2.2"/>
    <g stroke="#cc785c" stroke-width="2">
      <line x1="512" y1="34" x2="512" y2="22"/>
      <line x1="554" y1="74" x2="566" y2="74"/>
      <line x1="543" y1="43" x2="552" y2="34"/>
    </g>

    <!-- Clouds (sketchy) -->
    <g stroke-width="2.2">
      <path d="M70 96 q6 -20 26 -18 q8 -18 30 -12 q18 -2 20 16 q16 2 12 16 l-92 0 q-12 -4 -8 -18 z" fill="#fbfaf6"/>
      <path d="M300 60 q5 -16 22 -14 q8 -14 26 -9 q14 -2 16 13 l-66 0 q-6 -2 -4 -10 z" fill="#fbfaf6"/>
    </g>

    <!-- Departing plane in sky with motion lines -->
    <g transform="translate(150 150) rotate(-18)">
      <path d="M0 0 l86 -8 q22 -2 34 6 q-12 8 -34 8 l-86 -2 z" fill="#fbfaf6"/>
      <path d="M20 0 l-16 -22 8 0 26 18z" fill="#cc785c" stroke="#cc785c"/>
      <path d="M22 4 l-12 20 8 0 22 -16z" fill="#fbfaf6"/>
      <path d="M58 -4 l-6 -20 6 0 12 16z" fill="#cc785c" stroke="#cc785c"/>
      <circle cx="96" cy="2" r="2.2" fill="#1f1d1b"/>
    </g>
    <g stroke="#b9b3a5" stroke-width="2">
      <line x1="60" y1="138" x2="120" y2="120"/>
      <line x1="58" y1="156" x2="110" y2="140"/>
    </g>

    <!-- Control tower -->
    <g>
      <line x1="74" y1="300" x2="84" y2="180"/>
      <line x1="118" y1="300" x2="108" y2="180"/>
      <path d="M64 180 l64 0 6 -22 -76 0 z" fill="#f0eee6"/>
      <rect x="78" y="150" width="36" height="30" rx="4" fill="#eef3f5"/>
      <line x1="96" y1="150" x2="96" y2="126"/>
      <circle cx="96" cy="122" r="3" fill="#cc785c" stroke="#cc785c"/>
    </g>

    <!-- Terminal building with window wall -->
    <g>
      <path d="M150 300 l0 -120 q0 -16 16 -16 l250 0 q16 0 16 16 l0 120" fill="#faf9f5"/>
      <!-- window mullions -->
      <g stroke-width="2">
        <line x1="150" y1="214" x2="432" y2="214"/>
        <line x1="150" y1="256" x2="432" y2="256"/>
        <line x1="196" y1="180" x2="196" y2="300"/>
        <line x1="244" y1="178" x2="244" y2="300"/>
        <line x1="292" y1="176" x2="292" y2="300"/>
        <line x1="340" y1="178" x2="340" y2="300"/>
        <line x1="388" y1="180" x2="388" y2="300"/>
      </g>
      <!-- a few lit windows -->
      <rect x="198" y="216" width="44" height="38" fill="#f6e4db" stroke="none"/>
      <rect x="342" y="216" width="44" height="38" fill="#eef3f5" stroke="none"/>
      <rect x="246" y="258" width="44" height="40" fill="#f6e4db" stroke="none"/>
    </g>

    <!-- Parked jet at the gate (nose + jet bridge) -->
    <g>
      <path d="M470 250 q70 -14 110 -6 q26 4 18 16 q-10 12 -40 12 l-92 0 q-14 -10 4 -22 z" fill="#fbfaf6"/>
      <path d="M512 240 l-6 -34 8 0 16 30z" fill="#cc785c" stroke="#cc785c"/>
      <g stroke-width="1.8">
        <circle cx="496" cy="256" r="2.4" fill="#1f1d1b"/>
        <circle cx="512" cy="256" r="2.4" fill="#1f1d1b"/>
        <circle cx="528" cy="256" r="2.4" fill="#1f1d1b"/>
      </g>
      <path d="M432 270 l40 -8 0 16 -40 6 z" fill="#f0eee6"/>
    </g>

    <!-- Ground line -->
    <line x1="2" y1="300" x2="598" y2="300" stroke-width="3"/>
    <g stroke="#c1bbac" stroke-width="3" stroke-dasharray="14 12">
      <line x1="20" y1="360" x2="580" y2="360"/>
    </g>

    <!-- DEPARTURES sign -->
    <g transform="translate(300 332)">
      <rect x="-86" y="-22" width="172" height="34" rx="6" fill="#1f1d1b" stroke="none"/>
      <text x="0" y="2" fill="#faf9f5" font-family="Montserrat, Arial, sans-serif" font-size="17"
            font-weight="700" text-anchor="middle" stroke="none">DEPARTURES</text>
      <path d="M70 -5 l16 0 -5 -5 m5 5 -5 5" stroke="#cc785c" stroke-width="2.4"/>
    </g>

    <!-- Travelers with luggage -->
    <!-- traveler 1 -->
    <g transform="translate(150 392)">
      <circle cx="0" cy="-58" r="12" fill="#f0eee6"/>
      <path d="M0 -46 q-14 4 -14 26 l0 30 6 0 0 -26 m-6 26 0 22 m16 -78 q14 4 14 26 l0 30 -6 0 0 -26 m6 26 0 22"/>
      <!-- rolling suitcase -->
      <rect x="20" y="-30" width="26" height="34" rx="4" fill="#f6e4db"/>
      <line x1="33" y1="-30" x2="33" y2="-48"/>
      <circle cx="25" cy="8" r="3" fill="#1f1d1b"/>
      <circle cx="41" cy="8" r="3" fill="#1f1d1b"/>
    </g>

    <!-- traveler 2 (with backpack) -->
    <g transform="translate(250 398)">
      <circle cx="0" cy="-60" r="11" fill="#f0eee6"/>
      <path d="M0 -49 q-12 3 -12 24 l0 28 5 0 0 -24 m-5 24 0 22 m12 -74 q12 3 12 24 l0 28 -5 0 0 -24 m5 24 0 22"/>
      <rect x="-22" y="-46" width="14" height="22" rx="5" fill="#eef3f5"/>
    </g>

    <!-- luggage trolley -->
    <g transform="translate(420 396)">
      <path d="M0 0 l0 -54 l8 0"/>
      <rect x="-2" y="-30" width="46" height="30" rx="3" fill="#f6e4db"/>
      <rect x="2" y="-50" width="38" height="20" rx="3" fill="#eef3f5"/>
      <circle cx="6" cy="8" r="5"/>
      <circle cx="40" cy="8" r="5"/>
    </g>

    <!-- traveler 3 walking with case -->
    <g transform="translate(500 392)">
      <circle cx="0" cy="-58" r="12" fill="#f0eee6"/>
      <path d="M0 -46 q12 4 12 24 l0 18 m0 0 l10 22 m-10 -22 l-8 22 m-4 -42 q-12 4 -12 22"/>
      <rect x="-34" y="-28" width="22" height="30" rx="4" fill="#f6e4db"/>
      <line x1="-23" y1="-28" x2="-23" y2="-44"/>
    </g>

  </g>
</svg>
