{% load i18n %}<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"></head>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f0eee6;padding:28px 0;">
    <tr><td align="center">
      <table role="presentation" width="560" cellpadding="0" cellspacing="0"
             style="max-width:560px;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e3ded2;">
        <tr><td style="background:#ffffff;padding:18px 28px;border-bottom:1px solid #e3ded2;">
          <img src="{{ logo_url }}" alt="Jastip.me" width="183" height="34" style="display:block;border:0;height:34px;width:auto;">
        </td></tr>
        <tr><td style="padding:28px;font-size:15px;line-height:1.6;">
          {% block body %}{% endblock %}
        </td></tr>
        <tr><td style="padding:18px 28px;background:#faf9f5;border-top:1px solid #e3ded2;font-size:12px;color:#8a857a;">
          You're receiving this because you have an account on Jastip.me.
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
