# Shared security headers — include this in every location that needs them.
# Nginx does NOT inherit add_header from parent blocks when the location itself
# has any add_header directive, so this file must be included wherever needed.
#
# CSP allows:
#   - self-hosted fonts, CSS, JS ('self')
#   - Google AdSense (*.googlesyndication.com, adservice.google.com, *.doubleclick.net)
#   - Cloudflare Turnstile contact form (challenges.cloudflare.com)
#   - Google OAuth login (accounts.google.com)
#   - Inline scripts/styles ('unsafe-inline' — required until inline JS is extracted)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com https://adservice.google.com https://www.googletagservices.com https://tpc.googlesyndication.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; frame-src https://*.googlesyndication.com https://*.doubleclick.net https://challenges.cloudflare.com https://accounts.google.com; connect-src 'self' https://*.googlesyndication.com https://*.doubleclick.net; object-src 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com;" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Embedder-Policy "unsafe-none" always;
