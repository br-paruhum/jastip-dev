{% extends "email_base.html" %}
{% block body %}
  <h2 style="margin:0 0 12px;color:#1a1a18;font-size:20px;">New contact message</h2>
  <table class="invoice" style="width:100%">
    <tr><td style="width:110px">Topic</td><td>: <strong>{{ msg.get_topic_display }}</strong></td></tr>
    <tr><td>Name</td><td>: {{ msg.name }}</td></tr>
    <tr><td>Email</td><td>: <a href="mailto:{{ msg.email }}">{{ msg.email }}</a></td></tr>
    <tr><td>Received</td><td>: {{ msg.created_at|date:"d-M-Y H:i" }}</td></tr>
  </table>
  <p style="margin-top:16px;white-space:pre-wrap">{{ msg.message }}</p>
{% endblock %}
