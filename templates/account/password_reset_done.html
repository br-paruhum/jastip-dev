{% extends "account/base_entrance.html" %}
{% block title %}Check your email — {{ SITE_NAME }}{% endblock %}
{% block content %}

  <p class="muted text-center">We've sent you a link to reset your password. If it hasn't arrived in a few minutes, check your spam folder.</p>

    <a href="{% url 'account_login' %}">Back to login</a>
  </p>
{% endblock %}
