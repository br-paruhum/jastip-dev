# Security headers for /admin/ only — same as security-headers.conf but with
# 'unsafe-eval' added to script-src. Django admin (Unfold theme) uses Alpine.js,
# which evaluates its x-data/x-show/x-on expressions via Function()/eval() —
# without 'unsafe-eval' the browser silently blocks every Alpine expression, so
# panels that default to visible (filters, user menu, theme switcher) can never
# be hidden/closed. Scoped to /admin/ only so the public site keeps the stricter
# CSP (no eval) for its much larger XSS attack surface.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; frame-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Embedder-Policy "unsafe-none" always;
