{% extends "base.html" %}
{% comment %}
Wrap whatever the child puts in the content block — including allauth's own
pages — in the auth card, so every entrance page gets the gutter.
{% endcomment %}
{% block content_wrapper %}
<section>
  <div class="auth-wrap">
    <div class="auth-card">
      {{ block.super }}
    </div>
  </div>
</section>
{% endblock %}
