<!-- How It Works infographic — rendered as the SitePage(how-to) body inside pages/page.html.
     All CSS is scoped under .howto-ig / #hi-lightbox so it cannot affect the rest of the site,
     and colors reuse the site palette variables from static/css/main.css.
     Screenshots are served from /media/how-to/1.webp … 10.6.webp . -->
<style>
.howto-ig{width:100%;color:var(--slate-600);line-height:1.5}
.howto-ig .hi-lead{font-size:clamp(15px,4.2vw,24px);color:var(--slate-400);margin:0 0 22px;max-width:900px}
.howto-ig .hi-colhead{display:grid;grid-template-columns:1fr 2fr 1fr;gap:16px;
  position:sticky;top:69px;z-index:5;background:var(--ivory);padding:12px 0}
.howto-ig .hi-lane{font-weight:600;font-size:24px;letter-spacing:.04em;text-transform:uppercase;text-align:center;
  padding:10px;border-radius:10px;color:var(--slate);background:var(--cream);border:1px solid var(--line)}
.howto-ig .hi-timeline{position:relative}
.howto-ig .hi-step::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;
  transform:translateX(-50%);background:var(--line);z-index:-1}
.howto-ig .hi-step:last-child::before{bottom:50%}
.howto-ig .hi-step{display:grid;grid-template-columns:1fr 2fr 1fr;gap:16px;align-items:center;
  padding:16px 0;position:relative;z-index:1}
.howto-ig .hi-l{display:flex;justify-content:flex-end}
.howto-ig .hi-r{display:flex;justify-content:flex-start}
.howto-ig .hi-c{display:flex;flex-direction:column;align-items:center;gap:8px}
.howto-ig .hi-msg{max-width:100%;padding:12px 15px;border-radius:14px;border:1px solid var(--line);background:#fff;
  box-shadow:0 1px 2px rgba(26,26,24,.06);font-size:19.5px;line-height:1.45;color:var(--slate-600);text-align:center}
.howto-ig .system .hi-msg{background:var(--cream)}
.howto-ig .hi-who{display:block;font-size:20px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  margin-bottom:5px;color:var(--clay-dark)}
.howto-ig .hi-note{font-size:14px;font-weight:700;text-align:center;color:var(--clay-dark);
  border:1px solid var(--clay);border-radius:6px;padding:5px 12px;background:#fff;letter-spacing:.01em}
/* Mobile-only actor tag — shows who acts (Traveler/Buyer) once the lane columns collapse. */
.howto-ig .hi-mwho{display:none}
.howto-ig .hi-num{min-width:44px;height:44px;border-radius:50px;padding:0 10px;display:inline-flex;
  align-items:center;justify-content:center;font-weight:800;font-size:17px;color:#fff;
  background:var(--clay);box-shadow:0 0 0 5px var(--ivory)}
.howto-ig .hi-thumb{cursor:zoom-in;display:block;width:100%}
.howto-ig .hi-thumb img{width:100%;border-radius:10px;border:1px solid var(--line);background:#fff;
  box-shadow:0 6px 18px rgba(26,26,24,.10);display:block;transition:transform .15s}
.howto-ig .hi-thumb:hover img{transform:scale(1.02)}
#hi-lightbox{position:fixed;inset:0;z-index:1000;display:none;background:rgba(26,26,24,.9);
  align-items:center;justify-content:center;padding:28px}
#hi-lightbox.open{display:flex}
#hi-lightbox img{max-width:94vw;max-height:88vh;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.55)}
#hi-lightbox .hi-close{position:absolute;top:16px;right:22px;width:48px;height:48px;border:0;border-radius:50%;
  background:rgba(255,255,255,.16);color:#fff;font-size:28px;line-height:1;cursor:pointer}
#hi-lightbox .hi-cap{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:var(--cream);font-size:18px}
@media(max-width:760px){
  .howto-ig .hi-colhead{display:none}
  .howto-ig .hi-step::before{left:23px}
  .howto-ig .hi-step{grid-template-columns:1fr;gap:10px;padding:14px 0 22px 52px}
  .howto-ig .hi-l,.howto-ig .hi-r{justify-content:flex-start}
  .howto-ig .hi-msg{text-align:left}
  .howto-ig .hi-c{align-items:flex-start}
  .howto-ig .hi-num{position:absolute;left:4px;top:16px}
  .howto-ig .hi-mwho{display:block;width:max-content;max-width:100%;margin:0 0 7px;
    padding:3px 11px;border-radius:3px;border:1px solid var(--clay);background:#fff;
    color:var(--clay);font-size:12.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
}
</style>

<div class="howto-ig">
  <p class="hi-lead">The full journey from posting a travel plan to pickup the package and cleared transaction — Assuming Traveler and Buyer are registered and logged in. Click any screenshot to enlarge.</p>
  <div class="hi-colhead">
    <div class="hi-lane">Traveler</div>
    <div class="hi-lane">Jastip.me</div>
    <div class="hi-lane">Buyer</div>
  </div>
  <div class="hi-timeline" id="hi-timeline"></div>
</div>

<div id="hi-lightbox" aria-hidden="true">
  <button class="hi-close" id="hi-close" aria-label="Close">&times;</button>
  <img id="hi-img" src="" alt="">
  <div class="hi-cap" id="hi-cap"></div>
</div>

<script>
(function(){
  var STEPS=[
    {num:'1',    a:'traveler', img:'1.webp',
     caption:'New data displayed on Home page',
     t:'Go to <b>"My Travel Plans"</b>, click <b>"Post a Travel Plan"</b>, fill in required fields and click <b>"Submit Travel Plan"</b>.'},
    {num:'2',    a:'buyer',    img:'2.webp',
     t:'Go to the Home page, select a travel plan and click <b>"Order"</b>.'},
    {num:'3',    a:'buyer',    img:'3.webp',
     t:'Fill in detail of Ordered Product(s) and click <b>"Submit Order"</b>.'},
    {num:'4',    a:'traveler', img:'4.webp',
     note:'Traveler Notified',
     t:'Go to <b>"My Travel Plans"</b>, click <b>"Manage"</b>, fill in Estimate Unit Costs, Estimated weight, and click <b>"Submit Estimate"</b>.'},
    {num:'5',    a:'buyer',    img:'5.webp',
     note:'Buyer Notified',
     t:'Go to <b>"My Buying Orders"</b>, click <b>"Open"</b>, make bank transfer, upload transfer proof and click <b>"Submit Transfer Proof"</b>. You can pay in Invoice currency or IDR equivalent.'},
    {num:'6',    a:'traveler', img:'6.webp',
     note:'Admin verified the fund. Traveler notified — 50% deposit confirmed, purchasing can begin.',
     t:'Go to <b>"My Travel Plans"</b>, ensure the order has <b>"Deposit Paid"</b> status, then purchase the requested product(s). When done, click <b>"Manage"</b>, input actual quantity, actual unit cost, final shipment weight and click <b>"Submit Purchases"</b>.'},
    {num:'7',    a:'traveler', img:'7.webp',
     note:'Buyer Notified',
     t:'When arrived, go to <b>"My Travel Plans"</b>, click <b>"Manage"</b>, fill in Custom Duty currency and amount, upload proof of payment, and click <b>"Mark Arrived"</b>.'},
    {num:'8',    a:'buyer',    img:'8.webp',
     note:'Buyer Notified',
     t:'Go to <b>"My Buying Orders"</b>, click <b>"Open"</b>, make bank transfer, upload transfer proof and click <b>"Submit Transfer Proof"</b>. You can pay in Invoice currency or IDR equivalent.'},
    {num:'9.1',  a:'buyer',    img:'9.1.webp',
     note:'Admin verified. Both parties notified. · Option 1 — Pickup Locally',
     t:'Communicate directly with the Traveler regarding location and best time to visit. After collecting and checking the package, click <b>"Confirm Pickup"</b>.'},
    {num:'9.2',  a:'buyer',    img:'9.2.webp',
     note:'Option 2 — Request Reshipment',
     t:'Fill in your delivery address and click <b>"Request Reshipment"</b>.'},
    {num:'10.1', a:'traveler', img:'10.1.webp',
     note:'Traveler Notified',
     t:'Go to <b>"My Travel Plans"</b>, click <b>"Manage"</b> to review the reshipment request.'},
    {num:'10.2', a:'traveler', img:'10.2.webp',
     t:'Fill in shipment cost, bank name, account number, account name, upload cost proof (optional) and click <b>"Send to Buyer"</b>.'},
    {num:'10.3', a:'buyer',    img:'10.3.webp',
     note:'Buyer Notified',
     t:'Upload transfer proof and click <b>"Send Proof"</b>.'},
    {num:'10.4', a:'traveler', img:'10.4.webp',
     note:'Traveler Notified',
     t:'Upload the AWB / tracking number and shipment document, then click <b>"Submit AWB"</b>.'},
    {num:'10.5', a:'buyer',    img:'10.5.webp',
     note:'Package in Transit · Buyer Notified',
     t:'When the package arrives, click <b>"Confirm Received"</b>. Transaction is complete — Traveler fund disbursement is in process.'},
  ];
  var LABEL={traveler:'Traveler', buyer:'Buyer', system:'Jastip.me'};
  function bubble(s){
    var who=(s.a==='traveler'||s.a==='buyer')?'<span class="hi-mwho">'+LABEL[s.a]+'</span>':'';
    return '<div class="hi-msg">'+who+s.t+'</div>';}
  function thumb(s){var u='/media/how-to/'+s.img;
    return '<div class="hi-thumb"><img src="'+u+'" data-full="'+u+'" data-step="'+s.num+'" alt="Step '+s.num+'" loading="lazy"></div>';}
  var tl=document.getElementById('hi-timeline');
  if(!tl) return;
  tl.innerHTML=STEPS.map(function(s){
    var noteHtml=s.note?'<div class="hi-note">'+s.note+'</div>':'';
    var capHtml=s.caption?'<div class="hi-note">'+s.caption+'</div>':'';
    var numHtml='<div class="hi-num">'+s.num+'</div>';
    var left  = s.a==='traveler' ? bubble(s) : '';
    var right = s.a==='buyer'    ? bubble(s) : '';
    var sysBubble = s.a==='system' ? bubble(s) : '';
    var mid = noteHtml+sysBubble+numHtml+thumb(s)+capHtml;
    return '<div class="hi-step '+s.a+'"><div class="hi-l">'+left+'</div><div class="hi-c">'+mid+
           '</div><div class="hi-r">'+right+'</div></div>';
  }).join('');
  var lb=document.getElementById('hi-lightbox'),
      img=document.getElementById('hi-img'),
      cap=document.getElementById('hi-cap');
  function openLB(src){img.src=src;cap.textContent='Click outside or press Esc to close';
    lb.classList.add('open');lb.setAttribute('aria-hidden','false');}
  function closeLB(){lb.classList.remove('open');lb.setAttribute('aria-hidden','true');img.src='';}
  tl.addEventListener('click',function(e){var t=e.target.closest('img');
    if(!t||!t.getAttribute('data-full'))return; openLB(t.getAttribute('data-full'));});
  document.getElementById('hi-close').addEventListener('click',closeLB);
  lb.addEventListener('click',function(e){if(e.target===lb)closeLB();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLB();});
})();
</script>
