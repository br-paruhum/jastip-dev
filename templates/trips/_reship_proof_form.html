<form method="post" action="{% url 'trips:request_reship_proof' req.id %}" enctype="multipart/form-data">
  {% csrf_token %}
  <div class="form-field"><label>Reshipment payment proof (image)</label>
    <input type="file" name="reshipment_proof" accept="image/png,image/jpeg" required></div>
  <div style="text-align:center"><button class="btn btn-outline" type="submit">Send Proof</button></div>
</form>
