<span class="eyebrow">Ship Package · {{ reship_req.reference }}</span>
<h2>Mark Package as Sent</h2>
<p class="muted">Upload the AWB / waybill document, then submit. The buyer will be notified by email.</p>

<form method="post" action="{% url 'trips:request_reship' reship_req.id %}" enctype="multipart/form-data" class="card" style="margin-top:18px">
  {% csrf_token %}
  <div class="card-body">
    <div class="form-field"><label>AWB Document (PDF or image)</label>{{ reship_form.awb_document }}{{ reship_form.awb_document.errors }}</div>
    <div style="text-align:center"><button class="btn btn-primary" type="submit">Package Sent</button></div>
  </div>
</form>
